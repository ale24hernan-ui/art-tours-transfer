<!DOCTYPE html> <!-- Declara que este documento usa el estándar HTML5 moderno. -->
<html lang="es"> <!-- Define el idioma español para mejorar el posicionamiento SEO en búsquedas en Cancún. -->
<head> <!-- Abre la cabecera: contiene datos invisibles para el usuario pero vitales para el navegador. -->
    <meta charset="UTF-8"> <!-- Permite usar acentos y caracteres latinos sin que el texto se deforme. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Instruye al navegador para adaptar la web a pantallas de celulares (Responsive). -->
    <title>ART-TOURS TRANSFER | Transporte Privado en Cancún</title> <!-- El título que aparece en la pestaña del navegador. -->
    
    <!-- Importamos los íconos vectoriales de FontAwesome desde un servidor externo (CDN). -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Conectamos el archivo CSS usando Jinja2 para que Flask construya la ruta dinámica exacta. -->
    <!-- Mantenemos el '?v=1.1' para forzar la actualización de la memoria caché del navegador (Cache Busting). -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=1.2">
</head> <!-- Cierra la cabecera. -->

<body> <!-- Abre el cuerpo visible: todo lo que está aquí se renderizará en la pantalla del turista. -->

    <header class="navbar"> <!-- Define el bloque superior de la barra de navegación negra. -->
        
        <!-- Envolvemos la imagen en un enlace ('a') que apunta a la raíz ('/'), funcionando como un botón de "Inicio". -->
        <a href="/" class="logo-container">
            <!-- Insertamos el logotipo oficial PNG llamándolo desde la subcarpeta static/images/. -->
            <img src="{{ url_for('static', filename='images/logo-transfers.png') }}" alt="Logotipo ART-TOURS TRANSFER" class="logo-img">
        </a> <!-- Cierra el enlace del logotipo. -->

        <nav> <!-- Abre el contenedor para los botones del menú de navegación a la derecha. -->
            <a href="#servicios">Nuestros Servicios</a> <!-- Enlace ancla hacia la futura sección de servicios. -->
            <a href="#flota">Nuestra Flota</a> <!-- Enlace ancla hacia la futura galería de vehículos. -->
            <a href="#contacto">Contacto</a> <!-- Enlace ancla hacia la sección inferior de datos de contacto. -->
        </nav> <!-- Cierra el contenedor de navegación. -->

    </header> <!-- Cierra la barra superior. -->

    <!-- ========================================================================= -->
    <!-- LA CLAVE DE LA CORRECCIÓN: SECCIÓN HERO -->
    <!-- Este bloque debe envolver todo el contenido inicial para que CSS aplique la imagen 'playa-1-fondolargo.jpg'. -->
    <!-- ========================================================================= -->
    <section id="hero"> 

        <!-- Titular principal para captar la atención del turista inmediatamente. -->
        <h1>Reserva tu Traslado en Cancún</h1>
        
        <!-- Subtítulo que refuerza la propuesta de valor comercial. -->
        <p>Viaje seguro, privado y sin demoras hacia tu hotel.</p>

        <!-- Contenedor del widget de cotización rápida. -->
        <div class="widget-reserva">
            <!-- Formulario de captura; envía datos de forma segura (POST) a la ruta '/reservar' que procesará Flask. -->
            <form action="/reservar" method="POST">
                
                <label for="pasajeros">Número de Pasajeros:</label> <!-- Etiqueta descriptiva para el campo numérico. -->
                
                <!-- Input de pasajeros con restricción dura de 1 a 8, respetando la capacidad real de tu Van. -->
                <input type="number" id="pasajeros" name="pasajeros" min="1" max="8" required>
                
                <button type="submit">Verificar Disponibilidad</button> <!-- Botón que acciona el envío del formulario. -->
                
            </form> <!-- Cierra el formulario de reservación. -->
        </div> <!-- Cierra el widget. -->

    </section> <!-- Cierra la sección Hero. Esto detiene la imagen de fondo y permite que la página continúe bajando. -->

    <!-- Abre la sección final informativa al fondo de la página. -->
    <section id="contacto">
        <h3>Contacto Directo</h3> <!-- Título de la sección. -->
        <!-- Mostramos el WhatsApp corporativo oficial establecido en tus reglas de negocio. -->
        <p>WhatsApp: (+52) 998 215 6446</p>
        <!-- Mostramos el correo electrónico corporativo. -->
        <p>Email: aztec360@msn.com</p>
        <!-- Texto legal que otorga autoridad y profesionalismo a la marca. -->
        <p>© 2026 ART-TOURS TRANSFER. Todos los derechos reservados.</p>
    </section> <!-- Cierra la sección de contacto. -->

</body> <!-- Cierra el cuerpo visible. -->
</html> <!-- Fin absoluto del documento HTML. -->
